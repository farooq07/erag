services:
  app:
    build: .
    image: documind:latest
    ports:
      - "8000:8000"
    volumes:
      # Named volumes: the app runs as uid 10001 and can't write a host-owned bind mount.
      - appdata:/app/data
      - models:/home/documind/.cache   # embedding + reranker models, downloaded once
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://documind:${POSTGRES_PASSWORD:-documind}@postgres:5432/documind
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind}
      POSTGRES_DB: documind
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only needed when LLM_PROVIDER=ollama: `docker compose --profile ollama up`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  appdata:
  models:
  pgdata:
  ollama_models:
