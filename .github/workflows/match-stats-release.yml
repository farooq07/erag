name: Build Match Stats installer

# Builds the Windows installer for the Match Stats widget on a Windows runner.
#
# Two ways to trigger:
#   1. Push a tag like `match-stats-v0.1.0`  → builds + attaches installers to a
#      GitHub Release.
#   2. Actions tab → this workflow → "Run workflow" (manual) → installers are
#      uploaded as downloadable build artifacts (no release needed).

on:
  push:
    tags:
      - "match-stats-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: match-stats

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: match-stats/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: match-stats/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app + installers
        run: npm run tauri build

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: match-stats-windows-installers
          if-no-files-found: error
          path: |
            match-stats/src-tauri/target/release/bundle/nsis/*-setup.exe
            match-stats/src-tauri/target/release/bundle/msi/*.msi

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Match Stats ${{ github.ref_name }}
          draft: true
          files: |
            match-stats/src-tauri/target/release/bundle/nsis/*-setup.exe
            match-stats/src-tauri/target/release/bundle/msi/*.msi
