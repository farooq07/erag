<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floor Plan &amp; Seating Manager</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111c34; --panel2:#0b1526; --line:#233350;
    --text:#e7edf7; --muted:#93a4c0; --accent:#3b82f6; --accent2:#1e293b;
    --seat:#16233d; --seat-empty:#0e1a30; --danger:#ef4444; --ok:#22c55e;
    --radius:12px; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0b1220,#0f172a);color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  header.topbar{
    position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;
    padding:10px 14px;background:rgba(11,21,38,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-right:6px}
  .brand .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,#3b82f6,#22c55e)}
  .spacer{flex:1}
  button.btn,label.btn{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    background:var(--accent2);color:var(--text);border:1px solid var(--line);
    padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s;
  }
  button.btn:hover,label.btn:hover{background:#243248;border-color:#33507d}
  button.btn.primary{background:var(--accent);border-color:var(--accent)}
  button.btn.primary:hover{background:#2f74e6}
  button.btn.ghost{background:transparent}
  button.btn.danger{background:transparent;border-color:#5b2330;color:#fca5a5}
  button.btn.danger:hover{background:#3a1620}
  input.search{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:9px;font-size:13px;min-width:190px;
  }
  input.search::placeholder{color:var(--muted)}
  .layout{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  .board{flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px}
  .side{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:66px}
  @media(max-width:900px){.side{width:100%;position:static}}

  .floor{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
  @media(max-width:1150px){.floor{grid-template-columns:1fr 1fr}}
  @media(max-width:760px){.floor{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}

  .zone{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px;box-shadow:var(--shadow)}
  .zone.area{background:repeating-linear-gradient(45deg,#131f36,#131f36 10px,#16243f 10px,#16243f 20px)}
  .zone-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .zone-title{font-weight:700;font-size:14px;flex:1;cursor:text;padding:2px 4px;border-radius:6px}
  .zone-title:hover{background:var(--accent2)}
  .zone-meta{font-size:11px;color:var(--muted)}
  .zone-tools{display:flex;gap:4px}
  .icon-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
    background:var(--accent2);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
  .icon-btn:hover{color:var(--text);background:#243248}

  .row{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
  .row-label{width:34px;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:700;
    color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:7px;cursor:text}
  .row-seats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;flex:1;min-width:0}
  .row-add{width:26px;flex-shrink:0;display:grid;place-items:center;border-radius:7px;border:1px dashed var(--line);
    color:var(--muted);cursor:pointer;background:transparent}
  .row-add:hover{color:var(--text);border-color:#33507d}

  .seat{position:relative;min-height:44px;border-radius:9px;border:1px solid var(--line);
    background:var(--seat-empty);display:flex;flex-direction:column;justify-content:center;
    padding:5px 7px;cursor:pointer;overflow:hidden;transition:.12s;min-width:0}
  .seat.filled{background:var(--seat)}
  .seat:hover{border-color:#3a5a8f}
  .seat.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}
  .seat.dragging{opacity:.4}
  .seat.dim{opacity:.22}
  .seat.hit{outline:2px solid var(--ok);outline-offset:-2px}
  .seat .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .dp{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .tag{position:absolute;top:0;left:0;width:5px;height:100%;}
  .seat.empty .nm{color:#43567a;font-weight:500}
  .seat .seat-id{position:absolute;top:3px;right:5px;font-size:9px;color:#3f527a}

  .area-body{min-height:120px;display:grid;place-items:center;text-align:center}
  .area-body .big{font-size:16px;font-weight:800;letter-spacing:.5px;color:#c3d0e6}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 10px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .pool{min-height:60px;display:flex;flex-wrap:wrap;gap:7px;border:1px dashed var(--line);border-radius:10px;padding:9px;background:var(--panel2)}
  .pool.drag-over{border-color:var(--accent);background:#0e2038}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:600;
    background:var(--seat);border:1px solid var(--line);cursor:grab}
  .chip:active{cursor:grabbing}
  .chip.dragging{opacity:.4}
  .chip .swatch{width:9px;height:9px;border-radius:50%}
  .chip.dim{opacity:.25}
  .pool-empty{color:var(--muted);font-size:12px;align-self:center;margin:auto}

  .legend{display:flex;flex-direction:column;gap:6px}
  .leg-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 7px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .leg-item:hover{background:var(--panel2)}
  .leg-item.active{border-color:var(--accent);background:#0e2038}
  .leg-item .sw{width:14px;height:14px;border-radius:4px;flex-shrink:0}
  .leg-item .lg-name{flex:1;font-weight:600}
  .leg-item .lg-count{color:var(--muted);font-variant-numeric:tabular-nums}
  .leg-item .lg-color{width:22px;height:18px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
  .stat .v{font-size:20px;font-weight:800}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

  /* popover editor */
  .backdrop{position:fixed;inset:0;background:rgba(4,8,16,.55);z-index:60;display:none}
  .backdrop.show{display:block}
  .modal{position:fixed;z-index:61;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);padding:16px;width:290px;display:none}
  .modal.show{display:block}
  .modal h4{margin:0 0 12px;font-size:14px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:8px;font-size:13px}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .modal-actions .spacer{flex:1}
  .hint{font-size:11px;color:var(--muted);padding:0 14px 12px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2a45;border:1px solid var(--line);
    color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:80;
    opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span> Floor Plan &amp; Seating Manager</div>
  <input id="search" class="search" placeholder="Search person / dept…" />
  <div class="spacer"></div>
  <button class="btn primary" id="addPerson">＋ Person</button>
  <button class="btn" id="addZone">＋ Zone</button>
  <button class="btn" id="addArea">＋ Area</button>
  <button class="btn" id="exportBtn">Export</button>
  <label class="btn">Import<input id="importFile" type="file" accept="application/json" hidden></label>
  <button class="btn danger" id="resetBtn">Reset</button>
</header>

<div class="layout">
  <div class="board">
    <div class="floor" id="floor"></div>
  </div>

  <aside class="side">
    <div class="panel">
      <h3>Stats</h3>
      <div class="stats" id="stats"></div>
    </div>

    <div class="panel">
      <h3>Unassigned people</h3>
      <div class="pool" id="pool" data-drop="pool"></div>
      <div class="hint" style="padding:8px 0 0">Drag a chip onto any seat. Drag a seated person here to free them.</div>
    </div>

    <div class="panel">
      <h3>Departments <span style="float:right"><button class="icon-btn" id="addDept" title="Add department">＋</button></span></h3>
      <div class="legend" id="legend"></div>
      <div class="hint" style="padding:8px 0 0">Click a department to highlight it on the floor.</div>
    </div>
  </aside>
</div>

<!-- Seat editor -->
<div class="backdrop" id="backdrop"></div>
<div class="modal" id="seatModal">
  <h4 id="seatModalTitle">Seat</h4>
  <div class="field"><label>Name</label><input id="seatName" placeholder="Empty seat" autocomplete="off"></div>
  <div class="field"><label>Department</label><select id="seatDept"></select></div>
  <div class="modal-actions">
    <button class="btn danger" id="seatClear">Clear</button>
    <button class="btn" id="seatToPool">→ Pool</button>
    <div class="spacer"></div>
    <button class="btn primary" id="seatSave">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------------- storage ---------------- */
const KEY = "floorplan.v1";
const uid = () => Math.random().toString(36).slice(2,9);

const DEFAULT_DEPTS = {
  "Dev":"#3b82f6","Frontend":"#6366f1","Design":"#14b8a6","IT":"#1d4ed8",
  "HR":"#22c55e","DBA":"#64748b","AI":"#8b5cf6","BI":"#0ea5e9","SCRUM":"#f59e0b",
  "Batch":"#ec4899","Manager":"#10b981","QA":"#eab308","Other":"#94a3b8"
};

function grid(name, rows, perRow, prefix){
  const z={id:uid(),name,type:"grid",rows:[]};
  for(let r=0;r<rows;r++){
    const row={id:uid(),label:(prefix||"")+(r+1),seats:[]};
    for(let s=0;s<perRow;s++) row.seats.push({id:uid(),person:null});
    z.rows.push(row);
  }
  return z;
}
function area(name){return {id:uid(),name,type:"area",rows:[]};}

function defaultState(){
  const pool = [
    ["Abeera","HR"],["Mudassir","Dev"],["Naila","Dev"],["M. Atif","Manager"],
    ["Faisal Mughal","Manager"],["Abrar Haq","Manager"],["Usama","Dev"],["Zaman","Dev"],
    ["Awais Zulfiqar","Dev"],["Hamza","Dev"],["Abdullah","Dev"],["Daniyal","Dev"],
    ["Khizer","Dev"],["Umair","Dev"],["Hussain","Dev"],["Bilal","Dev"],
    ["Khubaib","Design"],["Faizan","Design"],["Fayyaz","Design"],["Haziq","Frontend"],["Ali","Dev"]
  ].map(([name,dept])=>({id:uid(),name,dept}));

  return {
    departments:{...DEFAULT_DEPTS},
    pool,
    columns:[
      // left column: 50 + 20
      [ grid("Left Block · 50 seats",10,5,"L"), grid("Left Block · 20 seats",4,5,"M") ],
      // middle: shared areas + manager cabins
      [ area("Conference Room"), area("Open to sky"),
        grid("Manager Cabins",3,1,"C") ],
      // right column: top 20 + bottom 20
      [ grid("Right Top · 20 seats",4,5,"R"), grid("Right Bottom · 20 seats",4,5,"B") ]
    ]
  };
}

let state = load() || defaultState();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); return s&&s.columns?s:null;}catch(e){return null;} }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

/* ---------------- helpers ---------------- */
function allSeats(){ const out=[]; state.columns.forEach(col=>col.forEach(z=>z.rows.forEach(r=>r.seats.forEach(s=>out.push(s))))); return out; }
function findSeat(id){ return allSeats().find(s=>s.id===id); }
function findZone(id){ for(const col of state.columns) for(const z of col) if(z.id===id) return z; }
function findRow(id){ for(const col of state.columns) for(const z of col) for(const r of z.rows) if(r.id===id) return r; }
function deptColor(d){ return state.departments[d] || "#94a3b8"; }
function toast(msg){ const t=el("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }
function el(id){ return document.getElementById(id); }

/* ---------------- render ---------------- */
let filterDept = null;
let searchTerm = "";

function render(){
  renderFloor();
  renderPool();
  renderLegend();
  renderStats();
  save();
}

function renderFloor(){
  const floor = el("floor");
  floor.innerHTML="";
  state.columns.forEach((col,ci)=>{
    const colEl=document.createElement("div");
    colEl.className="col";
    col.forEach(z=> colEl.appendChild(z.type==="area"?areaEl(z):zoneEl(z)) );
    // add-zone dropzone note
    floor.appendChild(colEl);
  });
}

function zoneEl(z){
  const seatCount = z.rows.reduce((a,r)=>a+r.seats.length,0);
  const filled = z.rows.reduce((a,r)=>a+r.seats.filter(s=>s.person).length,0);
  const wrap=document.createElement("div"); wrap.className="zone";
  const head=document.createElement("div"); head.className="zone-head";
  head.innerHTML=`<div class="zone-title" contenteditable="true" spellcheck="false" data-zone="${z.id}">${esc(z.name)}</div>
    <span class="zone-meta">${filled}/${seatCount}</span>`;
  const tools=document.createElement("div"); tools.className="zone-tools";
  tools.innerHTML=`<div class="icon-btn" title="Add row" data-act="addrow" data-id="${z.id}">＋</div>
    <div class="icon-btn" title="Delete zone" data-act="delzone" data-id="${z.id}">🗑</div>`;
  head.appendChild(tools);
  wrap.appendChild(head);

  z.rows.forEach(row=>{
    const rEl=document.createElement("div"); rEl.className="row";
    const lbl=document.createElement("div"); lbl.className="row-label"; lbl.contentEditable="true"; lbl.spellcheck=false;
    lbl.textContent=row.label; lbl.dataset.row=row.id;
    const seats=document.createElement("div"); seats.className="row-seats";
    row.seats.forEach(s=> seats.appendChild(seatEl(s)) );
    const addBtn=document.createElement("div"); addBtn.className="row-add"; addBtn.title="Add seat"; addBtn.textContent="＋";
    addBtn.dataset.act="addseat"; addBtn.dataset.id=row.id;
    rEl.append(lbl,seats,addBtn);
    wrap.appendChild(rEl);
  });
  return wrap;
}

function seatEl(s){
  const d=document.createElement("div");
  const filled=!!s.person;
  d.className="seat "+(filled?"filled":"empty");
  d.dataset.seat=s.id; d.draggable=filled;
  if(filled){
    const col=deptColor(s.person.dept);
    d.innerHTML=`<span class="tag" style="background:${col}"></span>
      <div class="nm">${esc(s.person.name)}</div>
      <div class="dp">${esc(s.person.dept||"")}</div>`;
    if(filterDept && s.person.dept!==filterDept) d.classList.add("dim");
    if(filterDept && s.person.dept===filterDept) d.classList.add("hit");
    if(searchTerm){
      const hit=(s.person.name+" "+(s.person.dept||"")).toLowerCase().includes(searchTerm);
      d.classList.toggle("hit",hit); d.classList.toggle("dim",!hit);
    }
  }else{
    d.innerHTML=`<div class="nm">＋ empty</div>`;
    if(filterDept||searchTerm) d.classList.add("dim");
  }
  return d;
}

function areaEl(z){
  const wrap=document.createElement("div"); wrap.className="zone area";
  const head=document.createElement("div"); head.className="zone-head";
  head.innerHTML=`<div class="zone-title" contenteditable="true" spellcheck="false" data-zone="${z.id}">${esc(z.name)}</div>`;
  const tools=document.createElement("div"); tools.className="zone-tools";
  tools.innerHTML=`<div class="icon-btn" title="Delete area" data-act="delzone" data-id="${z.id}">🗑</div>`;
  head.appendChild(tools); wrap.appendChild(head);
  const body=document.createElement("div"); body.className="area-body";
  body.innerHTML=`<div class="big">${esc(z.name)}</div>`;
  wrap.appendChild(body);
  return wrap;
}

function renderPool(){
  const p=el("pool"); p.innerHTML="";
  if(!state.pool.length){ p.innerHTML=`<div class="pool-empty">No unassigned people</div>`; return; }
  state.pool.forEach(person=>{
    const c=document.createElement("div"); c.className="chip"; c.draggable=true; c.dataset.person=person.id;
    c.innerHTML=`<span class="swatch" style="background:${deptColor(person.dept)}"></span>${esc(person.name)}`;
    if(filterDept && person.dept!==filterDept) c.classList.add("dim");
    if(searchTerm && !(person.name+" "+person.dept).toLowerCase().includes(searchTerm)) c.classList.add("dim");
    p.appendChild(c);
  });
}

function renderLegend(){
  const box=el("legend"); box.innerHTML="";
  const counts={}; allSeats().forEach(s=>{ if(s.person) counts[s.person.dept]=(counts[s.person.dept]||0)+1; });
  state.pool.forEach(p=> counts[p.dept]=(counts[p.dept]||0)+1 );
  Object.keys(state.departments).forEach(name=>{
    const item=document.createElement("div"); item.className="leg-item"+(filterDept===name?" active":"");
    item.dataset.dept=name;
    item.innerHTML=`<span class="sw" style="background:${state.departments[name]}"></span>
      <span class="lg-name">${esc(name)}</span>
      <span class="lg-count">${counts[name]||0}</span>
      <input class="lg-color" type="color" value="${state.departments[name]}" data-colordept="${name}" title="Change color">`;
    box.appendChild(item);
  });
}

function renderStats(){
  const seats=allSeats();
  const total=seats.length, filled=seats.filter(s=>s.person).length;
  el("stats").innerHTML=`
    <div class="stat"><div class="v">${filled}</div><div class="k">Seated</div></div>
    <div class="stat"><div class="v">${total-filled}</div><div class="k">Empty</div></div>
    <div class="stat"><div class="v">${state.pool.length}</div><div class="k">Pool</div></div>`;
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- drag & drop ---------------- */
let dragData=null;
document.addEventListener("dragstart",e=>{
  const seat=e.target.closest(".seat[draggable=true]");
  const chip=e.target.closest(".chip");
  if(seat){ dragData={kind:"seat",id:seat.dataset.seat}; seat.classList.add("dragging"); }
  else if(chip){ dragData={kind:"pool",id:chip.dataset.person}; chip.classList.add("dragging"); }
  if(dragData) e.dataTransfer.effectAllowed="move";
});
document.addEventListener("dragend",e=>{
  document.querySelectorAll(".dragging").forEach(n=>n.classList.remove("dragging"));
  document.querySelectorAll(".drag-over").forEach(n=>n.classList.remove("drag-over"));
  dragData=null;
});
document.addEventListener("dragover",e=>{
  const seat=e.target.closest(".seat"); const pool=e.target.closest("#pool");
  if((seat||pool)&&dragData){ e.preventDefault();
    document.querySelectorAll(".drag-over").forEach(n=>n.classList.remove("drag-over"));
    (seat||pool).classList.add("drag-over");
  }
});
document.addEventListener("drop",e=>{
  if(!dragData) return;
  const seatTarget=e.target.closest(".seat"); const poolTarget=e.target.closest("#pool");
  e.preventDefault();
  if(seatTarget){ dropOnSeat(seatTarget.dataset.seat); }
  else if(poolTarget){ dropOnPool(); }
  dragData=null; render();
});

function personFromPool(id){ const i=state.pool.findIndex(p=>p.id===id); return i>=0?state.pool.splice(i,1)[0]:null; }

function dropOnSeat(seatId){
  const target=findSeat(seatId); if(!target) return;
  if(dragData.kind==="pool"){
    const person=personFromPool(dragData.id); if(!person) return;
    if(target.person) state.pool.push(target.person); // bump current occupant to pool
    target.person={name:person.name,dept:person.dept};
  }else if(dragData.kind==="seat"){
    const src=findSeat(dragData.id); if(!src||src===target) return;
    const tmp=target.person; target.person=src.person; src.person=tmp; // swap/move
  }
}
function dropOnPool(){
  if(dragData.kind==="seat"){
    const src=findSeat(dragData.id); if(src&&src.person){ state.pool.push({id:uid(),...src.person}); src.person=null; }
  }
  // pool→pool: no-op
}

/* ---------------- click actions ---------------- */
el("floor").addEventListener("click",e=>{
  const actEl=e.target.closest("[data-act]");
  if(actEl){
    const {act,id}=actEl.dataset;
    if(act==="addrow"){ const z=findZone(id); const n=z.rows.reduce((a,r)=>a+r.seats.length,0)/Math.max(z.rows.length,1)||5;
      const per=Math.max(1,Math.round(z.rows[0]?z.rows[0].seats.length:5));
      const row={id:uid(),label:String(z.rows.length+1),seats:Array.from({length:per},()=>({id:uid(),person:null}))};
      z.rows.push(row); render(); }
    else if(act==="delzone"){ if(confirm("Delete this zone/area? Seated people are returned to the pool.")){
        const z=findZone(id); if(z) z.rows.forEach(r=>r.seats.forEach(s=>{ if(s.person) state.pool.push({id:uid(),...s.person}); }));
        state.columns=state.columns.map(col=>col.filter(zz=>zz.id!==id)); render(); } }
    else if(act==="addseat"){ const r=findRow(id); r.seats.push({id:uid(),person:null}); render(); }
    return;
  }
  const seat=e.target.closest(".seat");
  if(seat) openSeat(seat.dataset.seat);
});

// inline rename zone titles & row labels
el("floor").addEventListener("blur",e=>{
  const zt=e.target.closest?.(".zone-title"); const rl=e.target.closest?.(".row-label");
  if(zt&&zt.dataset.zone){ const z=findZone(zt.dataset.zone); if(z){ z.name=zt.textContent.trim()||z.name; save(); } }
  if(rl&&rl.dataset.row){ const r=findRow(rl.dataset.row); if(r){ r.label=rl.textContent.trim()||r.label; save(); } }
},true);
el("floor").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.target.classList.contains("zone-title")||e.target.classList.contains("row-label"))){ e.preventDefault(); e.target.blur(); }
});

/* ---------------- seat editor modal ---------------- */
let editingSeat=null;
function openSeat(id){
  editingSeat=findSeat(id); if(!editingSeat) return;
  el("seatName").value=editingSeat.person?editingSeat.person.name:"";
  fillDeptSelect(el("seatDept"), editingSeat.person?editingSeat.person.dept:"Dev");
  el("seatModalTitle").textContent=editingSeat.person?"Edit person":"Assign seat";
  showModal("seatModal");
  setTimeout(()=>el("seatName").focus(),30);
}
function fillDeptSelect(sel,current){
  sel.innerHTML="";
  Object.keys(state.departments).forEach(d=>{
    const o=document.createElement("option"); o.value=d; o.textContent=d; if(d===current)o.selected=true; sel.appendChild(o);
  });
}
el("seatSave").onclick=()=>{
  const name=el("seatName").value.trim();
  if(!name){ editingSeat.person=null; }
  else editingSeat.person={name,dept:el("seatDept").value};
  hideModal(); render();
};
el("seatClear").onclick=()=>{ editingSeat.person=null; hideModal(); render(); };
el("seatToPool").onclick=()=>{ if(editingSeat.person){ state.pool.push({id:uid(),...editingSeat.person}); editingSeat.person=null; } hideModal(); render(); };
el("seatName").addEventListener("keydown",e=>{ if(e.key==="Enter") el("seatSave").click(); });

function showModal(idm){
  el("backdrop").classList.add("show");
  const m=el(idm); m.classList.add("show");
  m.style.left=(window.innerWidth/2-m.offsetWidth/2)+"px";
  m.style.top=Math.max(70,window.innerHeight/2-m.offsetHeight/2)+"px";
}
function hideModal(){ el("backdrop").classList.remove("show"); document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show")); editingSeat=null; }
el("backdrop").onclick=hideModal;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideModal(); });

/* ---------------- legend interactions ---------------- */
el("legend").addEventListener("click",e=>{
  const color=e.target.closest(".lg-color"); if(color) return; // handled by input event
  const item=e.target.closest(".leg-item"); if(!item) return;
  filterDept = filterDept===item.dataset.dept ? null : item.dataset.dept;
  render();
});
el("legend").addEventListener("input",e=>{
  const c=e.target.closest(".lg-color"); if(!c) return;
  state.departments[c.dataset.colordept]=c.value; render();
});

/* ---------------- toolbar ---------------- */
el("search").addEventListener("input",e=>{ searchTerm=e.target.value.trim().toLowerCase(); render(); });

el("addPerson").onclick=()=>{
  const name=prompt("Person name:"); if(!name) return;
  const depts=Object.keys(state.departments);
  let dept=prompt("Department ("+depts.join(", ")+"):","Dev")||"Dev";
  if(!state.departments[dept]) state.departments[dept]=randomColor();
  state.pool.push({id:uid(),name:name.trim(),dept:dept.trim()}); render(); toast(name+" added to pool");
};
el("addZone").onclick=()=>{
  const name=prompt("New zone name:","New Zone"); if(!name) return;
  const rows=parseInt(prompt("How many rows?","4"),10)||4;
  const per=parseInt(prompt("Seats per row?","5"),10)||5;
  const colIdx=pickColumn();
  state.columns[colIdx].push(grid(name,rows,per,""));
  render(); toast("Zone added");
};
el("addArea").onclick=()=>{
  const name=prompt("Area name (e.g. Conference Room, Kitchen):","New Area"); if(!name) return;
  const colIdx=pickColumn();
  state.columns[colIdx].push(area(name)); render(); toast("Area added");
};
el("addDept").onclick=()=>{
  const name=prompt("Department name:"); if(!name) return;
  if(state.departments[name.trim()]){ toast("Already exists"); return; }
  state.departments[name.trim()]=randomColor(); render();
};
function pickColumn(){
  const c=prompt("Place in which column? 1 = Left, 2 = Middle, 3 = Right","1");
  const i=Math.min(2,Math.max(0,(parseInt(c,10)||1)-1)); return i;
}
function randomColor(){ const h=Math.floor(Math.random()*360); return `hsl(${h} 70% 55%)`; }

el("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="floor-plan-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  URL.revokeObjectURL(a.href); toast("Exported");
};
el("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.columns) throw 0; state=s; render(); toast("Imported"); }
    catch(err){ alert("Invalid file"); } };
  r.readAsText(f); e.target.value="";
};
el("resetBtn").onclick=()=>{ if(confirm("Reset to the default demo floor? This clears your changes.")){ state=defaultState(); render(); toast("Reset"); } };

/* ---------------- go ---------------- */
render();
</script>
</body>
</html>
