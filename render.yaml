# Render Blueprint: one Docker web service + one Postgres database.
# Deploy: Render dashboard → New → Blueprint → pick this repo. See docs/DEPLOY.md.
services:
  - type: web
    name: documind
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # One instance only: the ingest worker runs in-process and the vector
    # index (Chroma) lives on the attached disk.
    numInstances: 1
    healthCheckPath: /readyz
    disk:
      name: documind-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DOCUMIND_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: GROQ_API_KEY
        sync: false          # set in the dashboard
      - key: APP_BASE_URL
        sync: false          # e.g. https://documind.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false          # same as APP_BASE_URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: documind-db
    databaseName: documind
    user: documind
    plan: basic-256mb
